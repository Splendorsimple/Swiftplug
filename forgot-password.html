<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — SwiftPlug</title>
<link rel="icon" href="assets/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container-sm" style="margin-top:60px">
  <div id="form-wrap">
    <h1 style="font-size:1.6rem">Reset password</h1>
    <form id="forgot-form">
      <div class="field"><input type="email" id="email" placeholder="Your account email" required /></div>
      <p class="error-text hidden" id="error"></p>
      <button class="btn-primary" type="submit">Send reset link</button>
    </form>
  </div>
  <p id="sent-msg" class="hidden muted" style="text-align:center"></p>
</main>
<script type="module" src="js/forgot-password.js"></script>
</body>
</html>
