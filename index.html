<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Rent disposable verification numbers or keep a real phone number running, across countries. Pay in naira from one wallet." />
<title>SwiftPlug — Virtual numbers</title>
<link rel="icon" href="assets/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<main class="container hm">
  <div id="home-hi" class="hm-hi hidden"><span id="home-greet">Hello</span><h1 id="home-name">Hi</h1></div>

  <section id="home-balance" class="hm-bal hidden">
    <div class="hm-bal-top"><span>Available balance</span><button type="button" id="home-eye" class="hm-eye" aria-label="Show or hide balance"></button></div>
    <div class="hm-amt mono" id="home-balance-amt">₦0</div>
    <div class="hm-bal-btns">
      <a class="hm-fund" href="dashboard.html?section=wallet"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Fund wallet</a>
      <a class="hm-hist" href="dashboard.html?section=wallet" aria-label="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></a>
    </div>
  </section>

  <section class="hm-card">
    <div class="hm-head"><h2>Quick services</h2></div>
    <div id="home-tiles" class="hm-tiles"></div>
  </section>

  <section class="hm-card">
    <div class="hm-head"><h2>Popular services</h2></div>
    <input id="home-search" placeholder="Find a service..." autocomplete="off" />
    <div class="service-grid" id="home-service-grid" style="margin-top:14px"></div>
    <p id="home-empty" class="muted hidden" style="margin-top:20px">No services yet. Check back soon.</p>
  </section>

  <section id="home-history" class="hm-card hidden">
    <div class="hm-head"><h2>History</h2></div>
    <div id="home-rows"></div>
  </section>
</main>

<footer>
  <a href="terms.html">Terms</a>
  <a href="privacy.html">Privacy</a>
  <a href="refunds.html">Refunds</a>
</footer>

<script type="module" src="js/home.js"></script>
</body>
</html>
