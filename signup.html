<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta property="og:type" content="website" /><meta property="og:site_name" content="SwiftPlug" />
<meta property="og:title" content="Create your account — SwiftPlug" /><meta property="og:description" content="Fast, reliable, secure and cheap virtual numbers. One-time and long-term numbers, with codes delivered to your screen. Pick. Buy. Copy." />
<meta property="og:url" content="https://swiftplug.vercel.app/signup.html" /><meta property="og:image" content="https://swiftplug.vercel.app/assets/og-image.jpg" />

<meta name="twitter:card" content="summary_large_image" /><meta name="twitter:title" content="Create your account — SwiftPlug" />

<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/ui-v2.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container-sm" style="margin-top:60px">
  <div id="signup-form-wrap">
    <h1 style="font-size:1.6rem">Create your account</h1>
    <form id="signup-form">
      <div class="field"><input type="email" id="email" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="Email" required /></div>
      <div class="field"><input type="password" id="password" autocomplete="new-password" placeholder="Password (min 6 characters)" minlength="6" required /></div>
      <div class="field" style="display:flex;gap:8px;align-items:flex-start">
        <input type="checkbox" id="agree" style="width:auto;margin-top:3px" required />
        <label style="margin:0" for="agree">I agree to the <a href="terms.html" class="link">Terms of Service</a> and acceptable use policy.</label>
      </div>
      <p class="error-text hidden" id="signup-error"></p>
      <button class="btn-primary" type="submit" id="signup-btn">Create account</button>
    </form>
    <p class="muted" style="text-align:center;margin:16px 0">or</p>
    <button class="btn-outline" id="google-btn">Continue with Google</button>
    <p style="text-align:center;margin-top:20px" class="muted">
      Already have an account? <a href="login.html" class="link">Sign in</a>
    </p>
  </div>
  <div id="signup-done" class="hidden" style="text-align:center">
    <h1 style="font-size:1.4rem">Check your email</h1>
    <p class="muted">We sent a confirmation link to <strong id="sent-email"></strong>. Confirm it, then <a href="login.html" class="link">sign in</a>.</p>
  </div>
</main>
<script type="module" src="js/signup.js"></script>
</body>
</html>
