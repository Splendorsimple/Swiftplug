<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — SwiftPlug</title>
<link rel="icon" href="assets/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container-sm" style="margin-top:60px">
  <h1 style="font-size:1.6rem">Set a new password</h1>
  <form id="reset-form">
    <div class="field"><input type="password" id="password" placeholder="New password" minlength="6" required /></div>
    <p class="error-text hidden" id="error"></p>
    <button class="btn-primary" type="submit">Update password</button>
  </form>
  <p id="done-msg" class="hidden" style="color:rgb(var(--highlight))">Password updated! Redirecting...</p>
</main>
<script type="module" src="js/reset-password.js"></script>
</body>
</html>
