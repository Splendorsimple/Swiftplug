<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — SwiftPlug</title>
<link rel="icon" href="assets/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container-sm" style="margin-top:60px">
  <h1 style="font-size:1.6rem">Welcome back</h1>
  <form id="login-form">
    <div class="field"><input type="email" id="email" placeholder="Email" required /></div>
    <div class="field"><input type="password" id="password" placeholder="Password" required /></div>
    <p class="error-text hidden" id="login-error"></p>
    <button class="btn-primary" type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="muted" style="text-align:center;margin:16px 0">or</p>
  <button class="btn-outline" id="google-btn">Continue with Google</button>
  <p style="text-align:center;margin-top:20px" class="muted">
    <a href="forgot-password.html" class="link">Forgot password?</a>
  </p>
  <p style="text-align:center" class="muted">
    No account? <a href="signup.html" class="link">Sign up</a>
  </p>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
